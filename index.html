    <!-- TOAST NOTIFICATION -->

  <!-- JAVASCRIPT APP LOGIC -->
  <script>
    // Mật khẩu quản trị mặc định: admin123
    const ADMIN_PASSWORD = "admin123";
    
    // Seed Data
    const SEED = [
      ["hello","/həˈləʊ/","thán từ","xin chào","Hello, how are you?","Xin chào, bạn khỏe không?", "Cơ bản"],
      ["goodbye","/ɡʊdˈbaɪ/","thán từ","tạm biệt","Goodbye, see you tomorrow.","Tạm biệt, hẹn mai gặp lại.", "Cơ bản"],
      ["thank you","/ˈθæŋk juː/","cụm từ","cảm ơn","Thank you for your help.","Cảm ơn bạn đã giúp đỡ.", "Cơ bản"],
      ["love","/lʌv/","danh từ","tình yêu; tình thương","Love is patient and kind.","Tình yêu thì kiên nhẫn và tử tế.", "Cơ bản"],
      ["love","/lʌv/","động từ","yêu; thích","I love music.","Tôi yêu âm nhạc.", "Cơ bản"],
      ["book","/bʊk/","danh từ","quyển sách","She is reading a book.","Cô ấy đang đọc một quyển sách.", "Cơ bản"],
      ["water","/ˈwɔːtər/","danh từ","nước","Please drink more water.","Hãy uống nhiều nước hơn.", "Cơ bản"],
      ["food","/fuːd/","danh từ","thức ăn; đồ ăn","Vietnamese food is delicious.","Đồ ăn Việt Nam rất ngon.", "Cơ bản"],
      ["house","/haʊs/","danh từ","ngôi nhà","They bought a new house.","Họ đã mua một ngôi nhà mới.", "Cơ bản"],
      ["family","/ˈfæməli/","danh từ","gia đình","My family lives in Hanoi.","Gia đình tôi sống ở Hà Nội.", "Cơ bản"],
      ["friend","/frend/","danh từ","bạn bè","He is my best friend.","Anh ấy là bạn thân nhất của tôi.", "Cơ bản"],
      ["school","/skuːl/","danh từ","trường học","The school opens at seven.","Trường học mở cửa lúc bảy giờ.", "Cơ bản"],
      ["teacher","/ˈtiːtʃər/","danh từ","giáo viên","Our teacher is very kind.","Giáo viên của chúng tôi rất tốt bụng.", "Cơ bản"],
      ["student","/ˈstjuːdnt/","danh từ","học sinh; sinh viên","Every student has a laptop.","Mỗi sinh viên đều có một máy tính xách tay.", "Cơ bản"],
      ["learn","/lɜːn/","động từ","học; học hỏi","I want to learn English.","Tôi muốn học tiếng Anh.", "Cơ bản"],
      ["study","/ˈstʌdi/","động từ","học tập; nghiên cứu","She studies every night.","Cô ấy học mỗi tối.", "Cơ bản"],
      ["work","/wɜːk/","động từ","làm việc","He works at a bank.","Anh ấy làm việc ở ngân hàng.", "Cơ bản"],
      ["eat","/iːt/","động từ","ăn","We eat dinner at six.","Chúng tôi ăn tối lúc sáu giờ.", "Cơ bản"],
      ["drink","/drɪŋk/","động từ","uống","Do you drink coffee?","Bạn có uống cà phê không?", "Cơ bản"],
      ["sleep","/sliːp/","động từ","ngủ","The baby is sleeping.","Em bé đang ngủ.", "Cơ bản"],
      ["algorithm", "/ˈælɡərɪðəm/", "danh từ", "thuật toán", "This sorting algorithm is very efficient.", "Thuật toán sắp xếp này rất hiệu quả.", "Công nghệ"],
      ["bandwidth", "/ˈbændwɪdθ/", "danh từ", "băng thông", "Our internet bandwidth was upgraded.", "Băng thông mạng của chúng tôi đã được nâng cấp.", "Công nghệ"],
      ["browser", "/ˈbraʊzər/", "danh từ", "trình duyệt web", "Chrome is a popular web browser.", "Chrome là một trình duyệt web phổ biến.", "Công nghệ"],
      ["cloud", "/klaʊd/", "danh từ", "điện toán đám mây", "We store all our files in the cloud.", "Chúng tôi lưu trữ tất cả tệp trên đám mây.", "Công nghệ"],
      ["compiler", "/kəmˈpaɪlər/", "danh từ", "trình biên dịch", "The compiler reported three errors.", "Trình biên dịch đã báo cáo ba lỗi.", "Công nghệ"],
      ["encryption", "/ɪnˈkrɪpʃn/", "danh từ", "mã hóa", "Data encryption ensures user privacy.", "Mã hóa dữ liệu đảm bảo quyền riêng tư.", "Công nghệ"],
      ["firewall", "/ˈfaɪərwɔːl/", "danh từ", "tường lửa", "The firewall blocked suspicious traffic.", "Tường lửa đã chặn lưu lượng đáng ngờ.", "Công nghệ"],
      ["framework", "/ˈfreɪmwɜːk/", "danh từ", "khung phần mềm", "React is a popular JavaScript framework.", "React là một framework phổ biến.", "Công nghệ"],
      ["economy", "/ɪˈkɒnəmi/", "danh từ", "nền kinh tế", "The global economy is recovering.", "Nền kinh tế toàn cầu đang hồi phục.", "Kinh tế"],
      ["inflation", "/ɪnˈfleɪʃn/", "danh từ", "lạm phát", "High inflation reduces purchasing power.", "Lạm phát cao làm giảm sức mua.", "Kinh tế"],
      ["investment", "/ɪnˈvestmənt/", "danh từ", "sự đầu tư", "Real estate is a safe investment.", "Bất động sản là một khoản đầu tư an toàn.", "Kinh tế"],
      ["marketing", "/ˈmɑːkɪtɪŋ/", "danh từ", "tiếp thị", "Digital marketing requires creativity.", "Tiếp thị kỹ thuật số đòi hỏi sự sáng tạo.", "Kinh tế"],
      ["adaptation", "/ˌædæpˈteɪʃn/", "danh từ", "sự thích nghi", "Adaptation is key to survival.", "Sự thích nghi là chìa khóa để sinh tồn.", "Khoa học"],
      ["atmosphere", "/ˈætməsfɪər/", "danh từ", "bầu khí quyển", "Pollution damages the atmosphere.", "Ô nhiễm làm tổn hại bầu khí quyển.", "Khoa học"],
      ["biodiversity", "/ˌbaɪəʊdaɪˈvɜːsəti/", "danh từ", "đa dạng sinh học", "Forests host rich biodiversity.", "Rừng chứa đựng sự đa dạng sinh học.", "Khoa học"],
      ["ability", "/əˈbɪləti/", "danh từ", "khả năng", "She has the ability to learn fast.", "Cô ấy có khả năng học nhanh.", "Đời sống"],
      ["accident", "/ˈæksɪdənt/", "danh từ", "tai nạn", "He was hurt in a car accident.", "Anh ấy bị thương trong một vụ tai nạn.", "Đời sống"],
      ["achieve", "/əˈtʃiːv/", "động từ", "đạt được", "Work hard to achieve your goals.", "Hãy làm việc chăm chỉ để đạt mục tiêu.", "Đời sống"]
    ].map(a => ({en: a[0], ipa: a[1], pos: a[2], vi: a[3], ex: a[4], exVi: a[5], topic: a[6]||"Cơ bản"}));

    // Helpers
    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    const esc = s => String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm = s => String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").trim();

    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
    };

    function toast(msg) {
      const t = $("#toast");
      t.textContent = msg;
      t.classList.remove("opacity-0", "pointer-events-none", "translate-y-2");
      t.classList.add("opacity-100", "translate-y-0");
      clearTimeout(toast.t);
      toast.t = setTimeout(() => {
        t.classList.remove("opacity-100", "translate-y-0");
        t.classList.add("opacity-0", "pointer-events-none", "translate-y-2");
      }, 2200);
    }

    // State Variables
    let words = store.get("dict_words", null);
    if(!words || !words.length) { words = SEED.slice(); store.set("dict_words", words); }
    
    let favs = store.get("dict_favs", []);
    let hist = store.get("dict_hist", []);
    let dir = "en-vi"; 
    let currentTopic = "all";
    let activeView = "search";
    let isDarkMode = store.get("dict_dark", false);
    let isAdmin = sessionStorage.getItem("dict_admin") === "1";

    const saveWords = () => store.set("dict_words", words);

    // Dark Mode Toggle Logic
    function applyTheme() {
      if (isDarkMode) {
        document.documentElement.classList.add('dark');
        $("#theme-icon").textContent = "☀️";
      } else {
        document.documentElement.classList.remove('dark');
        $("#theme-icon").textContent = "🌙";
      }
      store.set("dict_dark", isDarkMode);
    }

    $("#theme-btn").onclick = () => {
      isDarkMode = !isDarkMode;
      applyTheme();
    };

    // Swap Direction
    $("#swap-btn").onclick = () => {
      dir = dir === "en-vi" ? "vi-en" : "en-vi";
      $("#lang-from").textContent = dir === "en-vi" ? "EN" : "VI";
      $("#lang-to").textContent = dir === "en-vi" ? "VI" : "EN";
      renderSuggestions();
    };

    // Search Logic
    function searchWords(q) {
      const n = norm(q);
      let pool = currentTopic === "all" ? words : words.filter(w => w.topic === currentTopic);
      if(!n) return pool;

      const key = dir === "en-vi" ? w => norm(w.en) : w => norm(w.vi);
      const score = w => {
        const k = key(w);
        if(k === n) return 0;
        if(k.startsWith(n)) return 1;
        if(k.includes(n)) return 2;
        return 9;
      };

      return pool.map(w => [score(w), w])
                 .filter(x => x[0] < 9)
                 .sort((a,b) => a[0] - b[0] || a[1].en.localeCompare(b[1].en))
                 .map(x => x[1]);
    }

    function renderSuggestions() {
      const q = $("#search-input").value;
      const resEl = $("#res");
      const pool = currentTopic === "all" ? words : words.filter(w => w.topic === currentTopic);

      if(!q.trim()) {
        resEl.innerHTML = `
          <div class="text-center py-12 px-4">
            <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-2xl">📖</div>
            <h3 class="text-sm font-bold text-slate-700 dark:text-slate-300">Chủ đề: ${currentTopic === "all" ? "Tất cả từ vựng" : currentTopic}</h3>
            <p class="text-xs text-slate-400 mt-1">Đang có ${pool.length} từ vựng khả dụng. Nhập vào ô tìm kiếm để tra từ nhanh.</p>
          </div>`;
        return;
      }

      const results = searchWords(q).slice(0, 30);
      if(!results.length) {
        resEl.innerHTML = `
          <div class="text-center py-12 px-4">
            <div class="text-3xl mb-2">🔍</div>
            <p class="text-sm font-semibold text-slate-600 dark:text-slate-400">Không tìm thấy từ “${esc(q)}”</p>
            <p class="text-xs text-slate-400 mt-1">Thử thay đổi từ khóa hoặc đổi chiều từ điển.</p>
          </div>`;
        return;
      }

      resEl.innerHTML = `
        <div class="divide-y divide-slate-100 dark:divide-slate-800 rounded-2xl bg-white dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800/80 overflow-hidden shadow-sm">
          ${results.map(w => `
            <div data-idx="${words.indexOf(w)}" class="sug-item flex items-center justify-between p-3.5 hover:bg-slate-50 dark:hover:bg-slate-800/80 cursor-pointer transition">
              <div>
                <span class="font-bold text-slate-800 dark:text-slate-100 text-sm">${esc(dir === "en-vi" ? w.en : w.vi)}</span>
                <span class="text-[11px] text-slate-400 ml-1.5 font-mono">${esc(w.ipa)}</span>
              </div>
              <div class="text-right">
                <span class="text-xs font-medium text-brand-600 dark:text-brand-400">${esc(dir === "en-vi" ? w.vi : w.en)}</span>
                <span class="block text-[10px] text-slate-400">${esc(w.topic)}</span>
              </div>
            </div>
          `).join("")}
        </div>
      `;

      $$(".sug-item").forEach(item => {
        item.onclick = () => showWordDetail(parseInt(item.dataset.idx));
      });
    }

    function showWordDetail(idx) {
      const w = words[idx];
      if(!w) return;

      hist = [w.en, ...hist.filter(h => h !== w.en)].slice(0, 50);
      store.set("dict_hist", hist);

      const isFav = favs.includes(w.en.toLowerCase());
      const sameWordGroup = words.filter(x => x.en.toLowerCase() === w.en.toLowerCase());

      $("#res").innerHTML = `
        <div class="p-5 rounded-3xl bg-white dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-800/80 shadow-md space-y-4">
          <div class="flex items-start justify-between gap-3">
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-2xl font-black text-brand-600 dark:text-brand-400">${esc(w.en)}</h2>
                <span class="text-xs px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-500 font-medium">${esc(w.topic)}</span>
              </div>
              <span class="text-xs text-slate-400 font-mono mt-0.5 block">${esc(w.ipa)}</span>
            </div>

            <div class="flex items-center gap-1.5">
              <button id="spk-en" class="w-9 h-9 rounded-full bg-brand-50 dark:bg-brand-950/60 text-brand-600 dark:text-brand-400 flex items-center justify-center hover:scale-105 active:scale-95 transition" title="Đọc tiếng Anh">🔊</button>
              <button id="fav-btn" class="w-9 h-9 rounded-full ${isFav ? 'bg-rose-50 text-rose-500 dark:bg-rose-950/50' : 'bg-slate-100 dark:bg-slate-800 text-slate-400'} flex items-center justify-center hover:scale-105 active:scale-95 transition" title="Yêu thích">
                ${isFav ? '❤️' : '🤍'}
              </button>
            </div>
          </div>

          <hr class="border-slate-100 dark:border-slate-800">

          <div class="space-y-4">
            ${sameWordGroup.map(g => `
              <div class="space-y-1.5">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold text-indigo-500 dark:text-indigo-400 uppercase tracking-wider">${esc(g.pos)}</span>
                  <button data-spk-vi="${esc(g.vi)}" class="spk-vi text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 flex items-center gap-1">🗣️ Đọc tiếng Việt</button>
                </div>
                <p class="text-base font-bold text-slate-800 dark:text-slate-100">${esc(g.vi)}</p>
                ${g.ex ? `
                  <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-900/50 border-l-4 border-brand-500 text-xs space-y-1 mt-2">
                    <p class="font-semibold text-slate-700 dark:text-slate-200">“${esc(g.ex)}”</p>
                    <p class="text-slate-400">${esc(g.exVi)}</p>
                  </div>
                ` : ''}
              </div>
            `).join("")}
          </div>
        </div>
      `;

      $("#spk-en").onclick = () => speak(w.en, "en-US");
      $("#fav-btn").onclick = () => {
        const k = w.en.toLowerCase();
        favs = favs.includes(k) ? favs.filter(f => f !== k) : [k, ...favs];
        store.set("dict_favs", favs);
        showWordDetail(idx);
        toast(favs.includes(k) ? "Đã lưu từ vựng" : "Đã bỏ lưu từ vựng");
      };

      $$(".spk-vi").forEach(btn => {
        btn.onclick = () => speak(btn.dataset.spkVi, "vi-VN");
      });
    }

    function speak(text, lang = "en-US") {
      if(!('speechSynthesis' in window)) return toast("Trình duyệt không hỗ trợ phát âm");
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.9;
      speechSynthesis.speak(u);
    }

    $("#search-input").oninput = (e) => {
      if(e.target.value) $("#clear-search").classList.remove("hidden");
      else $("#clear-search").classList.add("hidden");
      renderSuggestions();
    };

    $("#clear-search").onclick = () => {
      $("#search-input").value = "";
      $("#clear-search").classList.add("hidden");
      renderSuggestions();
    };

    $$(".t-chip").forEach(chip => {
      chip.onclick = () => {
        $$(".t-chip").forEach(c => {
          c.classList.remove("bg-brand-600", "text-white", "font-semibold", "shadow-sm");
          c.classList.add("bg-slate-100", "dark:bg-slate-800", "text-slate-600", "dark:text-slate-300");
        });
        chip.classList.remove("bg-slate-100", "dark:bg-slate-800", "text-slate-600", "dark:text-slate-300");
        chip.classList.add("bg-brand-600", "text-white", "font-semibold", "shadow-sm");
        
        currentTopic = chip.dataset.topic;
        if(activeView === "search") renderSuggestions();
        if(activeView === "flashcard") initFlashcard();
        if(activeView === "quiz") initQuiz();
      };
    });

    // Flashcards
    let fcList = [], fcIdx = 0, fcFlipped = false;

    function initFlashcard() {
      fcList = currentTopic === "all" 
        ? [...words].sort(() => Math.random() - 0.5) 
        : words.filter(w => w.topic === currentTopic).sort(() => Math.random() - 0.5);
      fcIdx = 0;
      fcFlipped = false;
      renderFlashcard();
    }

    function renderFlashcard() {
      const el = $("#v-flashcard");
      if(!fcList.length) {
        el.innerHTML = `<div class="text-center py-12 text-xs text-slate-400">Không có từ vựng nào trong chủ đề này.</div>`;
        return;
      }

      if(fcIdx >= fcList.length) {
        el.innerHTML = `
          <div class="p-8 rounded-3xl bg-white dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-800/80 text-center space-y-4">
            <div class="text-4xl">🎉</div>
            <h3 class="text-lg font-bold">Hoàn thành Flashcard!</h3>
            <p class="text-xs text-slate-400">Bạn đã hoàn thành lượt ôn tập cho chủ đề này.</p>
            <button id="fc-restart" class="w-full py-2.5 rounded-xl bg-brand-600 text-white font-semibold text-xs shadow-md shadow-brand-500/20 hover:bg-brand-700 transition">Học lại từ đầu</button>
          </div>
        `;
        $("#fc-restart").onclick = initFlashcard;
        return;
      }

      const w = fcList[fcIdx];

      el.innerHTML = `
        <div class="flex items-center justify-between text-xs text-slate-400 px-1">
          <span>Thẻ ${fcIdx + 1} / ${fcList.length} (${w.topic})</span>
          <button id="fc-shuffle" class="text-brand-600 dark:text-brand-400 hover:underline">Xáo trộn</button>
        </div>

        <div class="perspective-1000 w-full h-72">
          <div id="fc-card" class="transform-style-3d w-full h-full relative cursor-pointer ${fcFlipped ? 'rotate-y-180' : ''}">
            <div class="backface-hidden absolute inset-0 rounded-3xl p-6 bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-800/80 shadow-lg flex flex-col items-center justify-center text-center">
              <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-brand-50 dark:bg-brand-950/60 text-brand-600 dark:text-brand-400 mb-3">${esc(w.topic)}</span>
              <h2 class="text-3xl font-black text-slate-800 dark:text-slate-100">${esc(w.en)}</h2>
              <span class="text-sm font-mono text-slate-400 mt-1">${esc(w.ipa)}</span>
              <p class="text-[11px] text-slate-400 mt-6">(Chạm để xem nghĩa)</p>
            </div>

            <div class="backface-hidden rotate-y-180 absolute inset-0 rounded-3xl p-6 bg-gradient-to-br from-brand-600 to-indigo-700 text-white shadow-lg flex flex-col items-center justify-center text-center space-y-2">
              <span class="text-xs uppercase tracking-wider font-bold opacity-80">${esc(w.pos)}</span>
              <h3 class="text-2xl font-bold">${esc(w.vi)}</h3>
              ${w.ex ? `<p class="text-xs opacity-90 italic max-w-xs mt-2">“${esc(w.ex)}”</p>` : ''}
              <button id="fc-spk" class="mt-2 text-xl p-2 rounded-full bg-white/20 hover:bg-white/30 transition">🔊</button>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <button id="fc-hard" class="py-3 rounded-2xl bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-900/50 font-bold text-xs hover:bg-rose-100 transition">Chưa thuộc</button>
          <button id="fc-easy" class="py-3 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-900/50 font-bold text-xs hover:bg-emerald-100 transition">Đã thuộc</button>
        </div>
      `;

      $("#fc-card").onclick = (e) => {
        if(e.target.closest('#fc-spk')) return;
        fcFlipped = !fcFlipped;
        renderFlashcard();
      };

      const spkBtn = $("#fc-spk");
      if(spkBtn) spkBtn.onclick = () => speak(w.en, "en-US");

      $("#fc-hard").onclick = () => {
        fcList.push(fcList[fcIdx]);
        fcIdx++;
        fcFlipped = false;
        renderFlashcard();
      };

      $("#fc-easy").onclick = () => {
        fcIdx++;
        fcFlipped = false;
        renderFlashcard();
      };

      $("#fc-shuffle").onclick = initFlashcard;
    }

    // Quiz
    let qList = [], qIdx = 0, qScore = 0;

    function initQuiz() {
      let pool = currentTopic === "all" ? words : words.filter(w => w.topic === currentTopic);
      qList = [...pool].sort(() => Math.random() - 0.5).slice(0, 10);
      qIdx = 0;
      qScore = 0;
      renderQuiz();
    }

    function renderQuiz() {
      const el = $("#v-quiz");
      if(qList.length < 4) {
        el.innerHTML = `<div class="text-center py-12 text-xs text-slate-400">Cần ít nhất 4 từ vựng trong chủ đề này để làm đố vui.</div>`;
        return;
      }

      if(qIdx >= qList.length) {
        el.innerHTML = `
          <div class="p-8 rounded-3xl bg-white dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-800/80 text-center space-y-4">
            <div class="text-4xl">🏆</div>
            <h3 class="text-lg font-bold">Kết quả Trắc nghiệm</h3>
            <p class="text-sm font-semibold text-brand-600 dark:text-brand-400">Đúng ${qScore} / ${qList.length} câu</p>
            <button id="q-restart" class="w-full py-2.5 rounded-xl bg-brand-600 text-white font-semibold text-xs shadow-md shadow-brand-500/20 hover:bg-brand-700 transition">Thử lại lượt mới</button>
          </div>
        `;
        $("#q-restart").onclick = initQuiz;
        return;
      }

      const w = qList[qIdx];
      let options = [w];
      while(options.length < 4) {
        let rand = words[Math.floor(Math.random() * words.length)];
        if(!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      el.innerHTML = `
        <div class="flex items-center justify-between text-xs text-slate-400 px-1">
          <span>Câu ${qIdx + 1} / ${qList.length}</span>
          <span>Điểm: <b class="text-brand-600 dark:text-brand-400">${qScore}</b></span>
        </div>

        <div class="p-5 rounded-3xl bg-white dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-800/80 space-y-4 shadow-sm">
          <div class="text-center space-y-1 py-2">
            <span class="text-xs text-slate-400">Nghĩa của từ này là gì?</span>
            <h2 class="text-2xl font-black text-brand-600 dark:text-brand-400">${esc(w.en)}</h2>
            <span class="text-xs font-mono text-slate-400 block">${esc(w.ipa)}</span>
          </div>

          <div id="q-options" class="space-y-2">
            ${options.map(opt => `
              <button data-correct="${opt.vi === w.vi}" class="q-opt w-full p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200/80 dark:border-slate-800 text-left text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center justify-between">
                <span>${esc(opt.vi)}</span>
                <span class="text-[10px] text-slate-400 uppercase font-mono">${esc(opt.pos)}</span>
              </button>
            `).join("")}
          </div>
        </div>
      `;

      $$(".q-opt").forEach(btn => {
        btn.onclick = () => {
          const isCorrect = btn.dataset.correct === "true";
          $$(".q-opt").forEach(b => b.disabled = true);

          if(isCorrect) {
            btn.classList.add("bg-emerald-500", "text-white", "border-emerald-500");
            qScore++;
          } else {
            btn.classList.add("bg-rose-500", "text-white", "border-rose-500");
            $$(".q-opt").forEach(b => {
              if(b.dataset.correct === "true") {
                b.classList.add("bg-emerald-500", "text-white", "border-emerald-500");
              }
            });
          }

          setTimeout(() => {
            qIdx++;
            renderQuiz();
          }, 1000);
        };
      });
    }

    // Favorites
    function renderFavorites() {
      const el = $("#fav-list");
      $("#fav-count").textContent = `${favs.length} từ`;

      if(!favs.length) {
        el.innerHTML = `<div class="text-center py-12 text-xs text-slate-400">Chưa có từ vựng nào được yêu thích.</div>`;
        return;
      }

      const favWords = words.filter(w => favs.includes(w.en.toLowerCase()));

      el.innerHTML = favWords.map(w => `
        <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-800/80 flex items-center justify-between">
          <div>
            <h4 class="font-bold text-sm text-brand-600 dark:text-brand-400">${esc(w.en)} <span class="text-xs font-normal text-slate-400 font-mono">${esc(w.ipa)}</span></h4>
            <p class="text-xs font-medium text-slate-700 dark:text-slate-200">${esc(w.vi)}</p>
          </div>
          <button data-unfav="${esc(w.en.toLowerCase())}" class="unfav-btn text-rose-500 p-2 hover:bg-rose-50 dark:hover:bg-rose-950/50 rounded-xl transition">❤️</button>
        </div>
      `).join("");

      $$(".unfav-btn").forEach(b => {
        b.onclick = () => {
          const k = b.dataset.unfav;
          favs = favs.filter(f => f !== k);
          store.set("dict_favs", favs);
          renderFavorites();
          toast("Đã bỏ lưu");
        };
      });
    }

    // History
    function renderHistory() {
      const el = $("#his-list");
      if(!hist.length) {
        el.innerHTML = `<div class="text-center py-12 text-xs text-slate-400">Lịch sử tra cứu trống.</div>`;
        return;
      }

      el.innerHTML = hist.map(h => `
        <div data-his="${esc(h)}" class="his-item p-3 rounded-2xl bg-white dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-800/80 flex items-center justify-between cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 transition">
          <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">${esc(h)}</span>
          <span class="text-xs text-slate-400"> Tra lại ➔</span>
        </div>
      `).join("");

      $$(".his-item").forEach(item => {
        item.onclick = () => {
          $("#search-input").value = item.dataset.his;
          switchView("search");
          renderSuggestions();
        };
      });
    }

    $("#clear-his-btn").onclick = () => {
      hist = [];
      store.set("dict_hist", hist);
      renderHistory();
      toast("Đã xóa lịch sử");
    };

    // Admin Panel (Đã ẩn chữ gợi ý mật khẩu trong placeholder)
    function renderAdmin() {
      const el = $("#admin-container");

      if(!isAdmin) {
        el.innerHTML = `
          <div class="p-6 rounded-3xl bg-white dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-800/80 space-y-4 max-w-sm mx-auto">
            <h3 class="text-base font-bold text-center">🔐 Đăng nhập Quản trị</h3>
            <input id="admin-pass" type="password" placeholder="Nhập mật khẩu..." class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-brand-500 text-xs outline-none">
            <button id="admin-login-btn" class="w-full py-2.5 rounded-xl bg-brand-600 text-white font-semibold text-xs shadow-md shadow-brand-500/20 hover:bg-brand-700 transition">Đăng nhập</button>
          </div>
        `;

        $("#admin-login-btn").onclick = () => {
          if($("#admin-pass").value === ADMIN_PASSWORD) {
            isAdmin = true;
            sessionStorage.setItem("dict_admin", "1");
            renderAdmin();
            toast("Đã đăng nhập Admin");
          } else {
            toast("Mật khẩu không đúng");
          }
        };
        return;
      }

      el.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-bold">⚙️ Quản lý từ vựng</h3>
            <button id="admin-logout" class="text-xs text-rose-500 hover:underline">Đăng xuất</button>
          </div>

          <div class="p-4 rounded-2xl bg-white dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-800/80 space-y-3">
            <h4 class="text-xs font-bold text-brand-600 dark:text-brand-400">Thêm từ mới</h4>
            <div class="grid grid-cols-2 gap-2">
              <input id="a-en" placeholder="Từ tiếng Anh" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-900 border text-xs outline-none">
              <input id="a-ipa" placeholder="Phát âm /IPA/" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-900 border text-xs outline-none">
              <input id="a-pos" placeholder="Loại từ (danh từ...)" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-900 border text-xs outline-none">
              <select id="a-topic" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-900 border text-xs outline-none">
                <option value="Cơ bản">Cơ bản</option>
                <option value="Công nghệ">Công nghệ</option>
                <option value="Kinh tế">Kinh tế</option>
                <option value="Khoa học">Khoa học</option>
                <option value="Đời sống">Đời sống</option>
              </select>
            </div>
            <input id="a-vi" placeholder="Nghĩa tiếng Việt" class="w-full p-2 rounded-lg bg-slate-100 dark:bg-slate-900 border text-xs outline-none">
            <input id="a-ex" placeholder="Ví dụ tiếng Anh" class="w-full p-2 rounded-lg bg-slate-100 dark:bg-slate-900 border text-xs outline-none">
            <input id="a-exVi" placeholder="Dịch ví dụ" class="w-full p-2 rounded-lg bg-slate-100 dark:bg-slate-900 border text-xs outline-none">
            <button id="a-add-btn" class="w-full py-2 rounded-xl bg-brand-600 text-white font-semibold text-xs shadow-md hover:bg-brand-700 transition">Thêm từ vựng</button>
          </div>

          <div class="p-4 rounded-2xl bg-white dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-800/80 space-y-2">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-bold">Danh sách (${words.length})</span>
              <button id="a-reset" class="text-[11px] text-slate-400 hover:text-rose-500">Khôi phục gốc</button>
            </div>
            <div class="max-h-60 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800">
              ${words.map((w, i) => `
                <div class="py-2 flex items-center justify-between text-xs">
                  <div>
                    <span class="font-bold">${esc(w.en)}</span>
                    <span class="text-slate-400 ml-1">(${esc(w.vi)})</span>
                  </div>
                  <button data-del="${i}" class="a-del-btn text-rose-500 hover:underline text-[11px]">Xóa</button>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;

      $("#admin-logout").onclick = () => {
        isAdmin = false;
        sessionStorage.removeItem("dict_admin");
        renderAdmin();
      };

      $("#a-add-btn").onclick = () => {
        const en = $("#a-en").value.trim();
        const vi = $("#a-vi").value.trim();
        if(!en || !vi) return toast("Vui lòng nhập từ EN và nghĩa VI");

        words.unshift({
          en,
          ipa: $("#a-ipa").value.trim() || "/.../",
          pos: $("#a-pos").value.trim() || "danh từ",
          vi,
          ex: $("#a-ex").value.trim(),
          exVi: $("#a-exVi").value.trim(),
          topic: $("#a-topic").value
        });

        saveWords();
        renderAdmin();
        toast("Đã thêm từ mới!");
      };

      $$(".a-del-btn").forEach(b => {
        b.onclick = () => {
          const idx = parseInt(b.dataset.del);
          words.splice(idx, 1);
          saveWords();
          renderAdmin();
          toast("Đã xóa từ vựng");
        };
      });

      $("#a-reset").onclick = () => {
        if(confirm("Khôi phục danh sách từ vựng ban đầu?")) {
          words = SEED.slice();
          saveWords();
          renderAdmin();
          toast("Đã khôi phục dữ liệu gốc");
        }
      };
    }

    // View Router
    function switchView(viewName) {
      activeView = viewName;
      $$("main > section").forEach(s => s.classList.add("hidden"));
      $(`#v-${viewName}`).classList.remove("hidden");

      $$(".nav-btn").forEach(b => {
        if(b.dataset.v === viewName) {
          b.classList.add("text-brand-600", "dark:text-brand-400", "font-semibold");
          b.classList.remove("text-slate-400");
        } else {
          b.classList.remove("text-brand-600", "dark:text-brand-400", "font-semibold");
          b.classList.add("text-slate-400");
        }
      });

      if(viewName === "search") renderSuggestions();
      if(viewName === "flashcard") initFlashcard();
      if(viewName === "quiz") initQuiz();
      if(viewName === "fav") renderFavorites();
      if(viewName === "his") renderHistory();
      if(viewName === "adm") renderAdmin();
    }

    $$(".nav-btn").forEach(btn => {
      btn.onclick = () => switchView(btn.dataset.v);
    });

    // Init App
    applyTheme();
    renderSuggestions();
  </script>
</body>
</html>
